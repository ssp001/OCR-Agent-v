services:
  Minio:
    container_name: Minio
    image: "minio/minio:latest"
    ports:
      - 9001:9001
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always
volumes:
  minio_data: